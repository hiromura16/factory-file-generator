{
  "services": {
    "app": {
      "build": {
        "context": ".",
        "args": [
          "HTTP_PROXY",
          "HTTPS_PROXY",
          "NO_PROXY",
          "http_proxy",
          "https_proxy",
          "no_proxy"
        ]
      },
      "image": "factory-file-generator:local",
      "restart": "unless-stopped",
      "read_only": true,
      "tmpfs": [
        "/tmp:size=64m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "${APP_MEMORY:-512m}",
      "cpus": "${APP_CPUS:-1.0}",
      "pids_limit": 128,
      "stop_grace_period": "90s",
      "ports": [
        "${BIND_IP:-127.0.0.1}:${APP_PORT}:8080"
      ],
      "environment": {
        "TZ": "${TZ:-Asia/Tokyo}",
        "DATA_DIR": "/data",
        "APP_PORT": "${APP_PORT}",
        "MIN_AVAILABLE_GIB": "${MIN_AVAILABLE_GIB:-1}",
        "LANDING_DIR": "/landing",
        "CONNECTION_FILES_DIR": "/data/connection-files",
        "FILE_ALLOWED_ROOTS": "/landing:/network",
        "KRB5_CONFIG": "/data/connection-files/krb5.conf",
        "KRB5CCNAME": "FILE:/data/connection-files/krb5cc"
      },
      "volumes": [
        "app-data:/data",
        "${LANDING_DIR:?Set LANDING_DIR}:/landing"
      ],
      "labels": [
        "app.owner=factory-sources-v1",
        "app.component=factory-file-generator",
        "traefik.enable=false",
        "${FACTORY_GUARD_LABEL_PREFIX:-factory}.guard.managed=true",
        "lab.role=heavy",
        "lab.stop_priority=70"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    }
  },
  "volumes": {
    "app-data": {}
  }
}
