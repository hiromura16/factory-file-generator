[project]
name = 'factory-file-generator'
version = "0.2.0"
description = "Independent manufacturing factory data producer"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.40,<2",
    "cryptography>=46,<50",
    'fastapi==0.121.2',
    "fastavro>=1.12,<2",
    "openpyxl>=3.1,<4",
    "paramiko>=4,<6",
    "pillow>=12,<14",
    "pyarrow>=22,<25",
    "reportlab>=4.4,<5",
    "smbprotocol>=1.15,<2",
    'uvicorn==0.38.0',
]

[project.optional-dependencies]
kerberos = [
    "pyspnego[kerberos]>=0.12,<0.13",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
